# Model configuration
model_name: "mistralai/Mistral-7B-v0.1"
freeze_base: true

# Probe configuration
probe_config:
  num_classes: 2  # Binary classification
  dropout: 0.1
  use_regression: false  # Set to true for regression task
  regular_attention_everywhere: false

# Data configuration
num_train_samples: 20000
num_val_samples: 2000
max_length: 512
batch_size: 8
val_batch_size: 16
num_workers: 4

# Training configuration
num_epochs: 10
learning_rate: 1e-4
weight_decay: 0.01
max_grad_norm: 1.0

# Supervision signal
num_generations: 10
temperature: 1.0

# Logging
use_wandb: true
wandb_project: "attention-probing-uncertainty"
run_name: null  # Auto-generated if null

# Checkpointing
checkpoint_dir: "./checkpoints"
save_every_n_epochs: 2
val_every_n_steps: null  # Validate only at epoch end

# Data processing
reload_data: false  # Set to true to reprocess datasets